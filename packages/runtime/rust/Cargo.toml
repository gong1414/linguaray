[package]
name = "linguaray_runtime"
version = "0.1.0"
edition = "2021"

[lib]
name = "linguaray_runtime"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
linguaray-core = { path = "../../../crates/core" }
linguaray-api-core = { path = "../../../crates/api-core" }
linguaray-engine = { path = "../../../crates/engine" }
uniffi = { version = "=0.31.2", features = ["cli"] }
uniffi-dart = { git = "https://github.com/Uniffi-Dart/uniffi-dart.git", branch = "main" }
aho-corasick.workspace = true
anyhow = "1"
base64.workspace = true
camino = "1"
csv = "1"
png = "0.18"
quick-xml = "0.42"
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
struct-patch.workspace = true
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
arboard = "=3.6.1"
objc2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
arboard = "=3.6.1"

[build-dependencies]
uniffi-dart = { git = "https://github.com/Uniffi-Dart/uniffi-dart.git", branch = "main", features = [
  "build",
] }

[dev-dependencies]
uniffi-dart = { git = "https://github.com/Uniffi-Dart/uniffi-dart.git", branch = "main", features = [
  "bindgen-tests",
] }
uniffi = { version = "=0.31.2", features = ["bindgen-tests"] }
uniffi_testing = "=0.31.2"
anyhow = "1"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[[bin]]
name = "uniffi-bindgen-dart"
path = "src/bin/uniffi-bindgen-dart.rs"
