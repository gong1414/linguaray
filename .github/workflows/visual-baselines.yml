name: visual-baselines

# Visual baselines over the built Storybook (migration spec §八.4): every story
# is screenshotted per-platform. Baselines are committed; this job VERIFIES on
# both platforms. `regenerate: true` on workflow_dispatch writes new baselines
# and uploads them as an artifact for review before committing — CI never
# auto-updates baselines silently.

on:
  workflow_dispatch:
    inputs:
      regenerate:
        description: "Generate new baselines instead of verifying (uploads artifact)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "src/app/**"
      - "e2e/**"
      - "playwright.config.ts"
      - ".storybook/**"

jobs:
  visual:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
          - os: windows-latest
            platform: win32
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-storybook
      - run: npx playwright install chromium --with-deps
        shell: bash
      - name: Verify baselines
        if: ${{ !inputs.regenerate }}
        run: pnpm test:visual
      - name: Regenerate baselines (artifact only — never auto-commit)
        if: ${{ inputs.regenerate }}
        # `|| true`: generation is best-effort — a single unstable story must
        # not discard the other 124 written baselines. The VERIFICATION run
        # (regenerate=false) is the gate that must pass.
        run: pnpm test:visual -- --update-snapshots || true
      - name: Upload regenerated baselines
        if: ${{ inputs.regenerate }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-${{ matrix.platform }}
          path: e2e/storybook.visual.spec.ts-snapshots
          if-no-files-found: error

      # Baselines are NEVER auto-committed to main: generation opens a PR per
      # platform so a human reviews the pixel diffs before merging (spec §八.7).
      - name: Open baseline PR
        if: ${{ inputs.regenerate }}
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
          BRANCH: visual-baselines/${{ matrix.platform }}-${{ github.run_id }}
        shell: bash
        run: |
          git config user.name "linguaray-ci"
          git config user.email "ci@linguaray.local"
          git checkout -b "$BRANCH"
          git add e2e/storybook.visual.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "no baseline changes"; exit 0
          fi
          git commit -m "test(visual): regenerate $PLATFORM baselines (run ${{ github.run_id }})"
          git push origin "$BRANCH"
          gh pr create --title "Visual baselines: $PLATFORM (run ${{ github.run_id }})" \
            --body "Regenerated by CI run ${{ github.run_id }}. Review the pixel diffs before merging — CI never updates baselines without this human gate." \
            --base main --head "$BRANCH"
