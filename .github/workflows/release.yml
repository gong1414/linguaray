# Release workflow — dual mode (Task 5):
#
# 1. workflow_dispatch → UNSIGNED dry-run: builds all three platforms, uploads artifacts
#    tagged UNSIGNED, no GitHub Release, no secrets required. For validating the matrix.
#
# 2. push tag v* → SIGNED official release: Apple codesign + notarization + stapling,
#    Windows Authenticode. Fail-closed if secrets missing — NEVER silently downgrade to
#    unsigned on a tag release. Creates a GitHub Release only after all platforms pass.
#
# Tauri's macOS distribution REQUIRES signing + notarization for off-App-Store distribution.
# TAURI_SIGNING_PRIVATE_KEY* (updater key) is separate from Authenticode — do NOT conflate.

name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Unsigned dry-run (always true for manual dispatch)'
        required: false
        default: 'true'
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Determine mode: tag push = signed release; workflow_dispatch = unsigned dry-run.
  mode:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.set-mode.outputs.signed }}
    steps:
      - id: set-mode
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Mode: SIGNED release (tag push)"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Mode: UNSIGNED dry-run (workflow_dispatch)"
          fi

  build:
    needs: mode
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-intel
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # ── UNSIGNED dry-run path (workflow_dispatch) ──────────────────────────────
      # Builds unsigned; no secrets needed. Artifacts tagged UNSIGNED.
      # Do NOT set APPLE_SIGNING_IDENTITY (even to "") — Tauri interprets an empty-but-set
      # value as "sign with empty identity" and fails codesign. Leaving it unset lets Tauri
      # skip macOS signing entirely.
      - name: Build (unsigned dry-run)
        if: needs.mode.outputs.signed != 'true'
        working-directory: src-tauri
        run: pnpm tauri build --target ${{ matrix.target }}

      # ── SIGNED release path (tag push) ──────────────────────────────────────────
      # macOS: import cert → keychain → codesign → notarize → staple. Secrets required.
      - name: Import signing cert + build (macOS, signed)
        if: needs.mode.outputs.signed == 'true' && startsWith(matrix.os, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Fail-closed: tag release MUST have all macOS secrets.
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD \
                     APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!var}" ]; then
              echo "::error::$var secret is missing — tag releases MUST be signed (fail-closed)"
              exit 1
            fi
          done
          CERT_PATH="$RUNNER_TEMP/linguaray-cert.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          # Auto-lock after 3600s (official recommendation).
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -k build.keychain -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          # Verify the imported identity EXACTLY matches APPLE_SIGNING_IDENTITY — fail
          # here (clear error) rather than later with a vague codesign failure.
          security find-identity -v -p codesigning build.keychain > "$RUNNER_TEMP/identities.txt"
          cat "$RUNNER_TEMP/identities.txt"
          grep -F -- "$APPLE_SIGNING_IDENTITY" "$RUNNER_TEMP/identities.txt" \
            || { echo "::error::APPLE_SIGNING_IDENTITY '$APPLE_SIGNING_IDENTITY' not found among imported codesigning identities"; exit 1; }
          cd src-tauri && pnpm tauri build --target ${{ matrix.target }}

      - name: Cleanup keychain + cert (macOS)
        if: always() && startsWith(matrix.os, 'macos')
        run: |
          security delete-keychain build.keychain || true
          rm -f "$RUNNER_TEMP/linguaray-cert.p12"

      # Windows: import PFX → Authenticode via certificateThumbprint overlay. Secrets required.
      - name: Import PFX + build (Windows, signed)
        if: needs.mode.outputs.signed == 'true' && matrix.os == 'windows-latest'
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          # Fail-closed: tag release MUST have Windows signing secrets.
          if (-not $env:WINDOWS_CERTIFICATE_PFX) {
            Write-Error "WINDOWS_CERTIFICATE_PFX secret is missing — tag releases MUST be signed (fail-closed)"
            exit 1
          }
          $certPath = "$env:RUNNER_TEMP\linguaray-cert.pfx"
          [System.Convert]::FromBase64String("$env:WINDOWS_CERTIFICATE_PFX") | Set-Content $certPath -AsByteStream
          $imported = Import-PfxCertificate -CertStoreLocation Cert:\CurrentUser\My -FilePath $certPath -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
          $thumbprint = $imported.Thumbprint
          # Write overlay config to a FILE (no inline JSON quoting issues).
          $config = @{ bundle = @{ windows = @{ certificateThumbprint = $thumbprint; digestAlgorithm = "sha256"; timestampUrl = "http://timestamp.digicert.com" } } }
          $configPath = "$env:RUNNER_TEMP\tauri-windows-signing.conf.json"
          $config | ConvertTo-Json -Depth 5 | Set-Content $configPath
          cd src-tauri; pnpm tauri build --target ${{ matrix.target }} --config $configPath

      - name: Cleanup cert (Windows)
        if: always() && matrix.os == 'windows-latest'
        run: Remove-Item "$env:RUNNER_TEMP\linguaray-cert.pfx" -ErrorAction SilentlyContinue

      # ── Artifact upload ─────────────────────────────────────────────────────────
      # Upload the bundle artifacts (dmg/app on macOS, msi/exe on Windows).
      - name: Upload artifacts (UNSIGNED dry-run)
        if: needs.mode.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: linguaray-UNSIGNED-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
          if-no-files-found: error

      - name: Upload artifacts (signed release)
        if: needs.mode.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: linguaray-signed-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
          if-no-files-found: error

  # ── GitHub Release (tag push only, after ALL platforms pass) ─────────────────────
  release:
    needs: [mode, build]
    if: needs.mode.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all signed artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: linguaray-signed-*
          merge-multiple: true
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
