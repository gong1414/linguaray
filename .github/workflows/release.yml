name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.1

jobs:
  build:
    name: build-${{ matrix.device }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            device: macos
            build: flutter build macos --release
          - os: windows-2022
            device: windows
            build: flutter build windows --release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop/flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install CocoaPods
        if: runner.os == 'macOS'
        run: brew list cocoapods >/dev/null 2>&1 || brew install cocoapods
      - name: Resolve workspace dependencies
        working-directory: .
        run: dart pub get
      - run: flutter test
      - run: ${{ matrix.build }}
      - name: Package macOS build
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/LinguaRay.app dist/LinguaRay-macos.zip
          shasum -a 256 dist/LinguaRay-macos.zip > dist/SHA256SUMS-macos.txt
      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/LinguaRay-windows-x64.zip
          $hash = (Get-FileHash dist/LinguaRay-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  LinguaRay-windows-x64.zip" | Set-Content dist/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.device }}
          path: apps/desktop/flutter/dist/*
          if-no-files-found: error

  publish-draft:
    name: publish-draft
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release-assets/*
          --repo "$GITHUB_REPOSITORY"
          --draft
          --generate-notes
          --title "LinguaRay $GITHUB_REF_NAME"
