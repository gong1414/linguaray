name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.1

jobs:
  build:
    name: build-${{ matrix.device }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            device: macos
            build: flutter build macos --release
          - os: windows-2022
            device: windows
            build: flutter build windows --release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop/flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install macOS Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install CocoaPods
        if: runner.os == 'macOS'
        run: command -v pod >/dev/null 2>&1 || brew install cocoapods
      - name: Resolve workspace dependencies
        working-directory: .
        run: dart pub get
      - run: flutter test
      - run: ${{ matrix.build }}
      - name: Sign and notarize macOS app
        if: runner.os == 'macOS'
        env:
          MACOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          APP="build/macos/Build/Products/Release/LinguaRay.app"
          if [ -z "${MACOS_SIGNING_CERTIFICATE_BASE64:-}" ]; then
            echo "macOS signing secrets are not configured; packaging an unsigned development artifact."
            mkdir -p dist
            ditto -c -k --sequesterRsrc --keepParent "$APP" dist/LinguaRay-macos-unsigned.zip
            (cd dist && shasum -a 256 LinguaRay-macos-unsigned.zip > SHA256SUMS-macos.txt)
            exit 0
          fi
          CERT_PATH="$(mktemp).p12"
          KEYCHAIN="linguaray-signing.keychain-db"
          echo "$MACOS_SIGNING_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p temporary "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p temporary "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k temporary "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'\"' '/Developer ID Application/{print $2; exit}')"
          codesign --force --deep --options runtime --sign "$IDENTITY" "$APP"
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            ditto -c -k --keepParent "$APP" /tmp/LinguaRay-notarize.zip
            xcrun notarytool submit /tmp/LinguaRay-notarize.zip --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$APP"
          fi
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/LinguaRay-macos.zip
          (cd dist && shasum -a 256 LinguaRay-macos.zip > SHA256SUMS-macos.txt)
          rm -f "$CERT_PATH"
      - name: Package Windows build
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $payload = "build/windows/x64/runner/Release"
          if ($env:WINDOWS_CERTIFICATE_BASE64) {
            $certPath = Join-Path $env:RUNNER_TEMP "linguaray.pfx"
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            Get-ChildItem $payload -Recurse -Include *.exe,*.dll | ForEach-Object {
              & signtool sign /fd SHA256 /f $certPath /p $env:WINDOWS_CERTIFICATE_PASSWORD $_.FullName
            }
            Compress-Archive -Path "$payload\*" -DestinationPath dist/LinguaRay-windows-x64.zip
          } else {
            Write-Host "Windows Authenticode secrets are not configured; packaging an unsigned development artifact."
            Compress-Archive -Path "$payload\*" -DestinationPath dist/LinguaRay-windows-x64-unsigned.zip
          }
          $lines = @(Get-ChildItem dist/*.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          })
          $checksumPath = Join-Path (Get-Location) "dist/SHA256SUMS-windows.txt"
          [IO.File]::WriteAllText(
            $checksumPath,
            ($lines -join "`n") + "`n",
            [Text.UTF8Encoding]::new($false)
          )
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.device }}
          path: apps/desktop/flutter/dist/*
          if-no-files-found: error

  publish-draft:
    name: publish-draft
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release-assets/*
          --repo "$GITHUB_REPOSITORY"
          --draft
          --generate-notes
          --title "LinguaRay $GITHUB_REF_NAME"
