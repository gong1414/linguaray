name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.1

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: dart pub get
      - run: dart run melos run analyze
      - run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart')
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: dart run melos run dependency_validator

  desktop:
    name: desktop-${{ matrix.device }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple TranslationSession(installedSource:target:) requires the
          # macOS 26 SDK even though runtime availability is guarded.
          - os: macos-26
            device: macos
            build: flutter build macos --debug
          - os: windows-2022
            device: windows
            build: flutter build windows --debug
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop/flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install CocoaPods
        if: runner.os == 'macOS'
        run: brew list cocoapods >/dev/null 2>&1 || brew install cocoapods
      - name: Resolve workspace dependencies
        working-directory: .
        run: dart pub get
      - run: flutter test
      - name: Swift formatting
        if: runner.os == 'macOS'
        working-directory: .
        run: python3 scripts/format.py --check swift
      - name: Real system OCR fixture
        working-directory: .
        run: cargo test -p beyondtranslate_runtime system_ocr_recognizes_fixed_catalog_image
      - name: Desktop integration smoke
        run: flutter test integration_test/app_smoke_test.dart -d ${{ matrix.device }}
      # Integration testing replaces the local app bundle with its test
      # harness. Rebuild afterward so the uploaded artifact is a normal app.
      - run: ${{ matrix.build }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: linguaray-${{ matrix.device }}-debug
          path: |
            apps/desktop/flutter/build/macos/Build/Products/Debug/LinguaRay.app
            apps/desktop/flutter/build/windows/x64/runner/Debug
            apps/desktop/flutter/test/failures
          if-no-files-found: ignore
