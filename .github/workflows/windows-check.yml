# Windows build/lint gate — NO signing, NO release, NO secrets required.
#
# Purpose: give the Windows-only code (Phase 4 Tasks 1, 2, 2b) a gate it can be
# validated against as it lands, instead of merging blind. cargo check/test/clippy
# run the Rust that compiles on Windows (macOS-only deps are cfg-gated out);
# pnpm build + tsc validate the frontend. This is deliberately NOT a release
# workflow — Task 5 adds signing/notarization/artifact upload on tag.
#
# Runs on every push and pull_request to main. Cheap to re-run; cached.
name: windows-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (PRs churn fast).
concurrency:
  group: windows-check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # pnpm 9 (lockfileVersion 9.0). Pin via packageManager if present, else 9.x.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Cache the Windows cargo target dir keyed on Cargo.lock + rustc hash.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Frontend build (Vite)
        run: pnpm build

      - name: Frontend type-check (tsc)
        run: pnpm exec tsc --noEmit

      # Rust steps run from src-tauri (where Cargo.toml lives). --all-targets
      # covers lib, bins, tests, benches so the Task 2b windows::tests and the
      # real clipboard_win integration test are compiled/run on Windows.
      - name: cargo check --all-targets
        working-directory: src-tauri
        run: cargo check --all-targets --locked

      - name: cargo clippy --all-targets (-D warnings)
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test --all-targets
        working-directory: src-tauri
        run: cargo test --all-targets --locked --no-fail-fast
