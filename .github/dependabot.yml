version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      dart-and-flutter:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      rust:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /assets/brand/linguaray
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /assets/brand/linguaray
    schedule:
      interval: monthly
