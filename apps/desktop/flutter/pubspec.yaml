name: linguaray_desktop
description: A privacy-first desktop translation app built with Flutter and Rust.
homepage: https://github.com/gong1414/linguaray
publish_to: "none"
version: 0.6.1+20
resolution: workspace

environment:
  sdk: ">=3.13.1 <4.0.0"

dependencies:
  linguaray_application: ^0.1.0
  linguaray_runtime: ^0.0.1
  linguaray_ui: ^0.1.0

  cnativeapi: 0.2.3
  crypto: ^3.0.6
  cryptography: ^2.9.0
  ffi: ^2.1.3
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^10.3.1

  go_router: ^18.0.1
  intl: ^0.20.2
  hotkey_manager: 0.2.3
  nativeapi: 0.2.3
  package_info_plus: ^9.0.0
  path: ^1.8.3
  path_provider: ^2.1.6
  slang: ^4.13.0
  slang_flutter: ^4.13.0
  screen_capturer: 0.2.3
  widgetbook: 3.25.0

dev_dependencies:
  build_runner: ^2.16.1
  dependency_validator: ^5.0.5
  fake_async: ^1.3.3
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  slang_build_runner: ^4.19.0

flutter:
  uses-material-design: true

  assets:
    - resources/images/
