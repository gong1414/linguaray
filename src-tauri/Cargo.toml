[package]
name = "linguaray"
version = "0.1.0"
description = "Open-source, AI-native translation desktop app for macOS and Windows"
authors = ["gong1414"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "linguaray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
async-trait = "0.1"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
parking_lot = "0.12"
fs2 = "0.4"
thiserror = "1"
log = "0.4"
url = "2"
tauri-plugin-global-shortcut = "2"
mouse_position = "0.1"
arboard = "3"
enigo = "0.2"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_ColorSystem",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS system dictionary (DCSCopyTextDefinition) + Accessibility FFI (AX selection).
# Pinned to 0.9 to match accessibility-ng's core-foundation (avoids two versions
# of CFString in the graph; the vendored AX module and accessibility-ng must share).
core-foundation = "0.9"
core-foundation-sys = "0.8"
# Vendored AX-only read (vendor/get-selected-text-ax/) uses accessibility-ng.
accessibility-sys = "0.1"
accessibility-ng = "0.1"
accessibility-sys-ng = "0.1"
# objc2 high-level bindings for compound NSPasteboard multi-format restore (§B).
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSString"] }
objc2-app-kit = { version = "0.3", features = [
  "NSPasteboard",
  "NSPasteboardItem",
  "NSBitmapImageRep",
  "NSImageRep",
  "NSGraphics",
] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
